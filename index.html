<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAT FARM MANAGER</title>

    <link rel="stylesheet" href="css/style.css">

    <meta name="theme-color" content="#2E7D32">
</head>

<body>

<header class="header">
    <h1>🌱 YAT FARM MANAGER</h1>
    <span id="today"></span>
</header>

<div class="container">

    <!-- Dashboard -->

    <section class="dashboard">

        <div class="card income">
            <h3>💰 รายรับ</h3>
            <h2 id="income">0 บาท</h2>
        </div>

        <div class="card expense">
            <h3>💸 รายจ่าย</h3>
            <h2 id="expense">0 บาท</h2>
        </div>

        <div class="card pending">
            <h3>⏳ ค้างรับ</h3>
            <h2 id="pending">0 บาท</h2>
        </div>

        <div class="card paid">
            <h3>✅ รับเงินแล้ว</h3>
            <h2 id="paid">0 บาท</h2>
        </div>

        <div class="card harvest">
            <h3>📦 ผลผลิตรวม</h3>
            <h2 id="harvest">0 กก.</h2>
        </div>

    </section>

    <!-- เพิ่มข้อมูล -->

    <section class="form-card">

        <h2>เพิ่มข้อมูล</h2>

        <input type="date" id="date">

        <input type="text"
               id="plant"
               placeholder="ชื่อพืช"
               value="แตงกวา">

        <div class="row">
            <input type="number" id="aKg" placeholder="A (กก.)">
            <input type="number" id="aPrice" placeholder="ราคา A">
        </div>

        <div class="row">
            <input type="number" id="bKg" placeholder="B (กก.)">
            <input type="number" id="bPrice" placeholder="ราคา B">
        </div>

        <input type="number"
               id="expenseInput"
               placeholder="รายจ่าย">

        <select id="status">
            <option value="paid">รับเงินแล้ว</option>
            <option value="pending">ค้างรับ</option>
        </select>

        <button id="saveBtn">
            💾 บันทึกข้อมูล
        </button>

    </section>

    <!-- ตาราง -->

    <section class="table-card">

        <h2>ประวัติ</h2>

        <table>

            <thead>

            <tr>

                <th>วันที่</th>

                <th>พืช</th>

                <th>A</th>

                <th>B</th>

                <th>ยอดขาย</th>

                <th>สถานะ</th>

                <th>ลบ</th>

            </tr>

            </thead>

            <tbody id="historyTable">

            </tbody>

        </table>

    </section>

</div>

<script src="js/app.js"></script>

</body>
</html>
